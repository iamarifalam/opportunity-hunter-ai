[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-hunter-ai"
version = "1.0.0"
description = "Personal Rewards & Opportunity Discovery Automation Platform for Arif Alam"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "apscheduler>=3.10.4",
    "playwright>=1.46.0",
]

[tool.setuptools.packages.find]
include = ["hunter_ai*"]
